# Argo CD Application: Sealed Secrets
#
# Controller, der verschlüsselte "SealedSecrets" aus Git im Cluster
# zu normalen Kubernetes-Secrets entschlüsselt. Nur dieser Controller
# besitzt den privaten Schlüssel – die verschlüsselten Dateien dürfen
# daher sogar in öffentliche Repos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # Standardname, den das CLI-Werkzeug kubeseal ohne weitere
        # Angaben im Namespace kube-system erwartet
        fullnameOverride: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
