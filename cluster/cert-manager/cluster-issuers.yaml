# Let's Encrypt ClusterIssuer für cert-manager
#
# staging: zum Testen – Zertifikate werden vom Browser NICHT anerkannt,
#          dafür keine strengen Rate Limits
# prod:    echte, vertrauenswürdige Zertifikate – Rate Limits beachten
#
# Validierung per HTTP-01 über Traefik (Port 80 muss offen sein).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
